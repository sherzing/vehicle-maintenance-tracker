name: vmt_mobile
description: Vehicle Maintenance Tracker - Mobile App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.0
  http: ^1.2.0
  provider: ^6.1.0
  go_router: ^14.6.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  path_provider: ^2.1.0
  sqflite: ^2.4.0
  path: ^1.9.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.0
  mockito: ^5.4.0
  build_verify: ^3.1.0

flutter:
  uses-material-design: true
